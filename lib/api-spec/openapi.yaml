openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /taste/search:
    post:
      operationId: searchTaste
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TasteInput" }
      responses:
        "200":
          description: Candidate matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TasteResult" }
  /gifts/generate:
    post:
      operationId: generateGifts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftInput" }
      responses:
        "200":
          description: Filtered gift ideas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftResult" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    TasteInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, maxLength: 100 }
    TasteEntity:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
    TasteResult:
      type: object
      required: [matches, fallback]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/TasteEntity" }
        fallback: { type: boolean }
    GiftInput:
      type: object
      required: [recipientId, loves, refusals, budgetMin, budgetMax]
      properties:
        recipientId: { type: string, maxLength: 100 }
        loves:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 200 }
        refusals:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 200 }
        entityIds:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 200 }
        matchedLoves:
          type: array
          maxItems: 30
          items:
            type: object
            required: [love, entityId]
            properties:
              love: { type: string, maxLength: 200 }
              entityId: { type: string, maxLength: 200 }
        owned: { type: string, maxLength: 2000 }
        occasion: { type: string, maxLength: 100 }
        relationship: { type: string, maxLength: 100 }
        budgetMin: { type: number, minimum: 0, maximum: 100000 }
        budgetMax: { type: number, minimum: 0, maximum: 100000 }
        moreLike: { type: string, maxLength: 300 }
        moreLikeSeeds:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 300 }
        rejected:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Feedback" }
        previousTitles:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 300 }
    Feedback:
      type: object
      required: [title, reason]
      properties:
        title: { type: string, maxLength: 300 }
        reason: { type: string, maxLength: 100 }
    GiftIdea:
      type: object
      required: [id, recipientId, title, priceRange, whereToLook, because, passedRules, status, category, colours, brand, materials]
      properties:
        id: { type: string }
        recipientId: { type: string }
        title: { type: string }
        priceRange: { type: string }
        whereToLook: { type: string }
        because: { type: string }
        sourceLoves:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string }
          description: Exact supplied love strings validated by the server; optional for older locally saved ideas.
        kind:
          type: string
          enum: [object, experience, consumable, maker, collectible, wildcard]
        passedRules:
          type: array
          items: { type: string }
        status: { type: string, enum: [shown, saved, rejected] }
        rejectReason: { type: string }
        category: { type: string }
        colours:
          type: array
          items: { type: string }
        brand: { type: string }
        materials:
          type: array
          items: { type: string }
    GiftResult:
      type: object
      required: [ideas, fallback, filteredCount]
      properties:
        ideas:
          type: array
          items: { $ref: "#/components/schemas/GiftIdea" }
        fallback: { type: boolean }
        filteredCount: { type: integer }
        diagnostics:
          type: object
          required: [claudeCalls, expansionCalls, refusalCalls, generationCalls, criticCalls, rounds, profileCacheHit, model, helperModel]
          properties:
            claudeCalls: { type: integer }
            expansionCalls: { type: integer }
            refusalCalls: { type: integer }
            generationCalls: { type: integer }
            criticCalls: { type: integer }
            rounds: { type: integer }
            profileCacheHit: { type: boolean }
            model: { type: string }
            helperModel: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

